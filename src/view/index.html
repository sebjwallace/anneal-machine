<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A volume</title>
<style>
:root {
  --bg: #ffffff; --text: #1f1e1d; --muted: #8a8983; --secondary: #6b6a65;
  --quiet: #c4c2b9; --strong: #5f5e5a; --border: rgba(0,0,0,.12); --surface: #f5f4f0;
  --fit: #1D9E75; --heat: #E24B4A; --seq: #378ADD; --part: #C98A0B; --shared: #7F77DD;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1e1d; --text: #ecebe6; --muted: #8f8e88; --secondary: #a3a29c;
    --quiet: #4f4e4a; --strong: #b9b8b1; --border: rgba(255,255,255,.12); --surface: #2a2a28;
    --fit: #2BB88A; --heat: #F06463; --seq: #5AA2EC; --part: #E0A42A; --shared: #9D96EC;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1e1d; --text: #ecebe6; --muted: #8f8e88; --secondary: #a3a29c;
  --quiet: #4f4e4a; --strong: #b9b8b1; --border: rgba(255,255,255,.12); --surface: #2a2a28;
  --fit: #2BB88A; --heat: #F06463; --seq: #5AA2EC; --part: #E0A42A; --shared: #9D96EC;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 1.5rem auto; padding: 0 16px; }
h1 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
button, input { font: inherit; font-size: 13px; color: var(--text); background: transparent; border: .5px solid var(--quiet); border-radius: 8px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover, button.on { background: var(--surface); }
button.on { border-color: var(--strong); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }
#sequence { flex: 1 1 14em; max-width: 26em; font-family: ui-monospace, Menlo, monospace; }
select { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: .5px solid var(--quiet); border-radius: 8px; padding: 5px 8px; }
#error { color: var(--heat); font-size: 12px; }
#position { font-size: 13px; color: var(--secondary); margin-left: auto; font-family: ui-monospace, Menlo, monospace; }
#layers { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
.layer { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 5px; font-size: 12px; color: var(--muted); border-color: var(--border); }
.layer svg { opacity: .35; }
.layer.on { color: var(--text); background: transparent; border-color: var(--quiet); }
.layer.on svg { opacity: 1; }
.stage { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: minmax(0, 1fr); } }
#volume { width: 100%; height: auto; display: block; }
.side h2 { font-size: 12px; font-weight: 500; color: var(--secondary); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
#summary { font-size: 13px; min-height: 1.4em; margin: 0 0 14px; }
#tree { font-size: 13px; }
.node { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
.node:hover, .node.focus { background: var(--surface); }
.node.absent .name { color: var(--muted); }
.node .name { font-family: ui-monospace, Menlo, monospace; }
.node .born { margin-left: auto; color: var(--muted); font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
.sw { width: 12px; height: 12px; border-radius: 4px; flex: none; opacity: .85; }
.node.absent .sw { opacity: .3; }
.mark { font-size: 10.5px; padding: 0 5px; border-radius: 4px; border: .5px solid var(--border); }
.mark.seen { color: var(--fit); border-color: var(--fit); }
.mark.recalled { color: var(--seq); border-color: var(--seq); }
.mark.partial { color: var(--muted); }
.mark.shared { color: var(--shared); border-color: var(--shared); }
.mark.cut { color: var(--heat); border-color: var(--heat); }
.node.cut .name { color: var(--heat); text-decoration: line-through; }
.empty { color: var(--muted); font-size: 13px; }
#focus { font-size: 12px; margin-top: 12px; min-height: 2.4em; color: var(--secondary); line-height: 1.5; font-family: ui-monospace, Menlo, monospace; }
#focus b { color: var(--text); font-weight: 500; }
#caption { font-size: 14px; line-height: 1.5; color: var(--secondary); margin: 8px 0 10px; min-height: 1.5em; }
#timeline { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
.chip { display: grid; grid-template-columns: auto auto auto; gap: 5px; padding: 3px 7px; font-size: 11px; }
.chip-input { font-family: ui-monospace, Menlo, monospace; }
.chip-grown { color: var(--part); }
.chip-heat { color: var(--heat); }
.chip-heat::before { content: "●"; margin-right: 2px; }
.zero { color: var(--muted); opacity: .6; }
.muted { color: var(--muted); }
.heat { color: var(--heat); }
.seq { color: var(--seq); }
.part { color: var(--part); }
.keys { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>A volume</h1>

<div class="controls">
  <select id="example" aria-label="Examples"></select>
  <input id="sequence" value="ABEF CDGH IJMN KLOP ABEFIJMN CDGHKLOP ABCDEFGHIJKLMNOP ABEF" spellcheck="false" aria-label="Inputs, in order">
  <button id="reset">Reset</button>
  <button id="back">&larr;</button>
  <button id="next">&rarr;</button>
  <button id="play">Play</button>
  <span id="error"></span>
  <span id="position"></span>
</div>
<div id="layers" aria-label="Layers"></div>

<div class="stage">
  <svg id="volume" role="img" aria-label="The volume: columns of cells" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="side">
    <h2>Moment</h2>
    <div id="summary"></div>
    <h2>Structure</h2>
    <div id="tree"></div>
    <div id="focus"></div>
  </div>
</div>

<p id="caption"></p>
<div id="timeline" aria-label="Moments so far"></div>
<div class="keys">← → step · space play · point at a cell or a row of the structure; click to pin</div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
